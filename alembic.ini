# Alembic configuration (Phase 10 P1).
#
# The database URL is intentionally NOT stored here: alembic/env.py resolves
# it from DATABASE_URL / APS_DATABASE_URL (aps_persistence.config), so no
# credentials are ever committed. The programmatic helper
# aps_persistence.migrate also injects the URL in memory when needed.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
