[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-engine"
version = "0.1.0"
description = "Deterministic production scheduler for a wood/furniture factory (orders, operations, machines, shifts, employees, skills, materials) built on OR-Tools CP-SAT, with JSON dataset/result persistence and a service API facade."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
aps-engine = "aps_engine.cli.main:main"

[tool.setuptools.packages.find]
include = ["aps_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
