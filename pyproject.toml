[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-engine"
version = "0.1.0"
description = "Deterministic production scheduler for a wood/furniture factory (orders, operations, machines, shifts, employees, skills, materials) built on OR-Tools CP-SAT, with JSON dataset/result persistence, a service API facade, a thin FastAPI application layer (aps_api) and a PostgreSQL persistence layer (aps_persistence)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.8",
    "fastapi>=0.110",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=7",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.scripts]
aps-engine = "aps_engine.cli.main:main"

[tool.setuptools.packages.find]
include = ["aps_engine*", "aps_api*", "aps_persistence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
