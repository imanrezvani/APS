[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-engine"
version = "0.1.0"
description = "Phase 1 core production scheduler for a wood/furniture factory, built on OR-Tools CP-SAT."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["aps_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
